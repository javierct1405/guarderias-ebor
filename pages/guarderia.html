<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pagina-titulo">Guardería — Guarderías Ebor Querétaro</title>
    <meta name="description"
        content="Información, fachada, teléfono y recorrido de las instalaciones de Guarderías Ebor Querétaro.">

    <!-- Tipografía Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Hojas de estilo compartidas -->
    <link rel="stylesheet" href="../css/styles.css?v=4">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="pagina-detalle">

    <!-- Barra de navegación superior y botón volver -->
    <header class="detalle-header">
        <div class="detalle-nav-contenedor">
            <div class="detalle-nav-izquierda">
                <a href="../index.html" class="btn-volver-arriba" id="btn-volver-superior">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Volver al inicio</span>
                </a>
                <a href="inscripciones.html" class="btn-nav-secundario">Inscripciones</a>
            </div>

            <a href="../index.html" class="detalle-logo-enlace" aria-label="Ir al inicio de Guarderías Ebor">
                <img src="../assets/img/banner-principal.png" alt="Logotipo Guarderías Ebor Querétaro"
                    class="detalle-logo-img" width="140" height="163">
            </a>
        </div>
    </header>

    <!-- Contenedor dinámico del plantel -->
    <main class="detalle-principal" id="contenedor-detalle">
        <!-- Renderizado dinámico vía JavaScript -->
        <div class="cargando-estado" id="estado-cargando">
            <p>Cargando información de la guardería...</p>
        </div>
    </main>

    <!-- Pie de página institucional -->
    <footer class="pie-pagina">
        <div class="pie-contenido">
            <p class="pie-marca"><strong>Guarderías Ebor Querétaro</strong></p>
            <p class="pie-nota">Atención telefónica directa en cada uno de nuestros planteles</p>
            <nav class="pie-redes" aria-label="Redes sociales de Guarderías Ebor">
                <a href="https://www.facebook.com/profile.php?id=61594847834977" target="_blank" rel="noopener noreferrer" aria-label="Visitar Facebook de Guarderías Ebor">
                    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M14 8h3V4h-3c-3 0-5 2-5 5v2H6v4h3v7h4v-7h3.2l.8-4h-4V9c0-.7.3-1 1-1Z"/></svg>
                    <span>Facebook</span>
                </a>
                <a href="https://www.instagram.com/guarderiaseborqueretaro/" target="_blank" rel="noopener noreferrer" aria-label="Visitar Instagram de Guarderías Ebor">
                    <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" class="instagram-punto"/></svg>
                    <span>Instagram</span>
                </a>
            </nav>
            <p class="pie-copyright">&copy; 2026 Guarderías Ebor Querétaro. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../js/guarderias.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const guarderiaId = params.get("id");
            const contenedor = document.getElementById("contenedor-detalle");

            if (!guarderiaId || typeof guarderias === "undefined") {
                mostrarError("No se especificó ninguna guardería.");
                return;
            }

            const guarderia = guarderias.find(g => g.id.toLowerCase() === guarderiaId.toLowerCase());

            if (!guarderia) {
                mostrarError("La guardería seleccionada no fue encontrada.");
                return;
            }

            // Actualizar título de la página
            document.title = `${guarderia.nombre} (${guarderia.codigo}) — Guarderías Ebor Querétaro`;
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) {
                metaDesc.setAttribute("content", `Conoce las instalaciones, fachada y teléfono del plantel ${guarderia.nombre} (${guarderia.codigo}) de Guarderías Ebor Querétaro.`);
            }

            // Aplicar variable de color de acento al contenedor
            contenedor.style.setProperty("--color-acento", guarderia.colorHex);
            contenedor.style.setProperty("--color-acento-bg", guarderia.colorBg);
            contenedor.style.setProperty("--color-acento-borde", guarderia.colorBorde);

            // Preparar bloque de dirección física
            let direccionHtml = "";
            if (guarderia.direccion && guarderia.direccion.trim() !== "") {
                direccionHtml = `<p class="info-valor">${guarderia.direccion}</p>`;
            } else {
                direccionHtml = `
                    <div class="caja-preparada">
                        <svg class="icono-caja" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <p class="texto-preparado">Espacio preparado para la dirección física de este plantel.</p>
                    </div>`;
            }

            // Preparar botón Cómo llegar (Google Maps)
            let mapsHtml = "";
            if (guarderia.googleMaps && guarderia.googleMaps.trim() !== "") {
                mapsHtml = `
                    <a href="${guarderia.googleMaps}" target="_blank" rel="noopener noreferrer" class="btn-accion-plantel">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                        </svg>
                        <span>Cómo llegar (Google Maps)</span>
                    </a>`;
            } else {
                mapsHtml = `
                    <div class="caja-preparada-boton">
                        <span class="btn-como-llegar deshabilitado-preparado" title="Enlace a Google Maps en preparación">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                            </svg>
                            <span>Cómo llegar (Ubicación en Maps próximamente)</span>
                        </span>
                    </div>`;
            }

            // Preparar descripción general
            let descripcionHtml = "";
            if (guarderia.descripcion && guarderia.descripcion.trim() !== "") {
                descripcionHtml = `<p class="descripcion-parrafo">${guarderia.descripcion}</p>`;
            } else {
                descripcionHtml = `
                    <div class="caja-preparada">
                        <svg class="icono-caja" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                        <p class="texto-preparado">Espacio preparado para la descripción general e información de este plantel.</p>
                    </div>`;
            }

            // Mantener los espacios reservados hasta incorporar fotografías reales.
            let galeriaSeccionHtml = "";
            if (guarderia.galeria && guarderia.galeria.length > 0) {
                galeriaSeccionHtml = `
                    <section class="ficha-seccion-bloque" aria-label="Galería de instalaciones">
                        <h2 class="seccion-bloque-titulo">Galería de instalaciones</h2>
                        <div class="carrusel-galeria" tabindex="0" aria-label="Fotografías de ${guarderia.nombre}">
                            <div class="carrusel-ventana">
                                <div class="carrusel-pista">
                                    ${guarderia.galeria.map((foto, indice) => {
                                        const src = typeof foto === "string" ? foto : foto.src;
                                        const titulo = typeof foto === "string" ? `Fotografía ${indice + 1}` : foto.titulo;
                                        return `
                                            <figure class="carrusel-diapositiva" aria-hidden="${indice !== 0}">
                                                <img src="${src}" alt="${titulo} de ${guarderia.nombre}" loading="lazy">
                                                <figcaption>${titulo}</figcaption>
                                            </figure>
                                        `;
                                    }).join("")}
                                </div>
                            </div>
                            ${guarderia.galeria.length > 1 ? `
                                <button class="carrusel-boton carrusel-anterior" type="button" aria-label="Fotografía anterior">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
                                </button>
                                <button class="carrusel-boton carrusel-siguiente" type="button" aria-label="Fotografía siguiente">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                </button>
                                <div class="carrusel-controles" aria-live="polite">
                                    <div class="carrusel-puntos" aria-hidden="true">
                                        ${guarderia.galeria.map((_, indice) => `<span class="carrusel-punto${indice === 0 ? " activo" : ""}"></span>`).join("")}
                                    </div>
                                    <span class="carrusel-contador">1 / ${guarderia.galeria.length}</span>
                                </div>
                            ` : ""}
                        </div>
                    </section>`;
            } else {
                galeriaSeccionHtml = `
                    <section class="ficha-seccion-bloque" aria-label="Galería de instalaciones">
                        <h2 class="seccion-bloque-titulo">Galería de instalaciones</h2>
                        <div class="galeria-preparada-grid">
                            ${["Salas de atención", "Patio y áreas de juego", "Áreas comunes"].map(nombre => `
                                <div class="slot-preparado">
                                    <svg class="slot-icono" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                        <polyline points="21 15 16 10 5 21"></polyline>
                                    </svg>
                                    <span class="slot-texto">${nombre}</span>
                                    <small class="slot-estado">Fotografía próximamente</small>
                                </div>
                            `).join("")}
                        </div>
                    </section>`;
            }

            // Mantener también un espacio claro para futuros recorridos.
            let videosSeccionHtml = "";
            if (guarderia.videos && guarderia.videos.length > 0) {
                videosSeccionHtml = `
                    <section class="ficha-seccion-bloque" aria-label="Videos o recorridos">
                        <h2 class="seccion-bloque-titulo">Videos y recorridos</h2>
                        <div class="videos-grid">
                            ${guarderia.videos.map((video, indice) => {
                                const src = typeof video === "string" ? video : video.src;
                                const titulo = typeof video === "string"
                                    ? `Video ${indice + 1}`
                                    : (video.titulo || `Video ${indice + 1}`);
                                return `
                                    <figure class="video-item">
                                        <video controls preload="metadata" playsinline class="video-reproductor">
                                            <source src="${src}" type="video/mp4">
                                            Tu navegador no puede reproducir este video.
                                        </video>
                                        <figcaption>${titulo}</figcaption>
                                    </figure>
                                `;
                            }).join("")}
                        </div>
                    </section>`;
            } else {
                videosSeccionHtml = `
                    <section class="ficha-seccion-bloque" aria-label="Videos o recorridos">
                        <h2 class="seccion-bloque-titulo">Videos y recorridos</h2>
                        <div class="video-preparado-caja">
                            <svg class="slot-icono-video" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                <rect x="1" y="5" width="15" height="14" rx="2"></rect>
                            </svg>
                            <p class="texto-preparado-video">Próximamente podrás conocer este plantel mediante un recorrido.</p>
                        </div>
                    </section>`;
            }

            // Estructura completa de la página individual
            contenedor.innerHTML = `
                <article class="ficha-guarderia">
                    <section class="ficha-resumen" aria-label="Resumen del plantel">
                        <div class="ficha-seccion-fachada">
                            <div class="fachada-marco">
                                <img src="${guarderia.imagenDetalle}" alt="Fachada oficial de Guardería ${guarderia.nombre}" class="fachada-foto-grande">
                            </div>
                        </div>
                        <div class="ficha-identidad">
                            <div class="ficha-identidad-cabecera">
                                <p class="ficha-kicker">Plantel Guarderías Ebor</p>
                                <h1 class="ficha-nombre">${guarderia.nombre}</h1>
                                <span class="ficha-codigo-badge">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                                        <path d="M7 8h10M7 12h4m-4 4h10"></path>
                                    </svg>
                                    <span>Código IMSS: ${guarderia.codigo}</span>
                                </span>
                            </div>
                            <div class="descripcion-parrafo">${descripcionHtml.replace(/^<p class="descripcion-parrafo">|<\/p>$/g, "")}</div>
                        </div>
                    </section>

                    <!-- 4, 5 y 6: Teléfono para llamar, Dirección y Cómo llegar -->
                    <section class="ficha-seccion-contacto" aria-label="Contacto y ubicación">
                        <div class="contacto-cabecera">
                            <div>
                                <p class="ficha-kicker">Información útil</p>
                                <h2>Contacto y siguientes pasos</h2>
                            </div>
                        </div>
                        <div class="cuadricula-contacto">
                            <!-- 4: Número telefónico con botón para llamar -->
                            <div class="tarjeta-contacto-item tarjeta-tel-accion">
                                <div class="contacto-titulo-fila">
                                    <span class="contacto-icono" aria-hidden="true">
                                        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                    </span>
                                    <h2 class="contacto-subtitulo">Teléfono de atención</h2>
                                </div>
                                <p class="contacto-indicacion">Llamada directa desde tu dispositivo:</p>
                                <a href="tel:${guarderia.telefono}" class="btn-accion-plantel" aria-label="Llamar a Guardería ${guarderia.nombre} al ${guarderia.telefonoFormato}">
                                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                                    </svg>
                                    <span class="btn-llamar-texto">Llamar: ${guarderia.telefonoFormato}</span>
                                </a>
                            </div>

                            <!-- 5 y 6: Dirección física y Cómo llegar -->
                            <div class="tarjeta-contacto-item">
                                <div class="contacto-titulo-fila">
                                    <span class="contacto-icono" aria-hidden="true">
                                        <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                    </span>
                                    <h2 class="contacto-subtitulo">Ubicación y dirección</h2>
                                </div>
                                ${direccionHtml}
                                <div class="contenedor-como-llegar">
                                    ${mapsHtml}
                                </div>
                            </div>

                            <div class="tarjeta-contacto-item tarjeta-inscripcion-cta">
                                <div class="contacto-titulo-fila">
                                    <span class="contacto-icono" aria-hidden="true">
                                        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                                    </span>
                                    <h2 class="contacto-subtitulo">Cómo inscribir</h2>
                                </div>
                                <p class="contacto-indicacion">Consulta el proceso oficial del IMSS y revisa la guardería de tu elección.</p>
                                <a href="inscripciones.html" class="btn-accion-plantel">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                                    </svg>
                                    <span>Ver proceso de inscripción</span>
                                </a>
                            </div>
                        </div>
                    </section>

                    ${galeriaSeccionHtml}
                    ${videosSeccionHtml}

                    <!-- 10: Botón para regresar a la página principal -->
                    <div class="ficha-pie-navegacion">
                        <a href="../index.html" class="btn-regresar-catalogo">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="19" y1="12" x2="5" y2="12"></line>
                                <polyline points="12 19 5 12 12 5"></polyline>
                            </svg>
                            <span>Regresar al listado de guarderías</span>
                        </a>
                    </div>
                </article>
            `;

            inicializarCarruseles();
        });

        function inicializarCarruseles() {
            document.querySelectorAll(".carrusel-galeria").forEach((carrusel) => {
                const pista = carrusel.querySelector(".carrusel-pista");
                const diapositivas = [...carrusel.querySelectorAll(".carrusel-diapositiva")];
                const puntos = [...carrusel.querySelectorAll(".carrusel-punto")];
                const contador = carrusel.querySelector(".carrusel-contador");
                const anterior = carrusel.querySelector(".carrusel-anterior");
                const siguiente = carrusel.querySelector(".carrusel-siguiente");
                let indiceActual = 0;
                let inicioToque = 0;

                if (diapositivas.length < 2) return;

                const mostrar = (nuevoIndice) => {
                    indiceActual = (nuevoIndice + diapositivas.length) % diapositivas.length;
                    pista.style.transform = `translateX(-${indiceActual * 100}%)`;
                    diapositivas.forEach((diapositiva, indice) => diapositiva.setAttribute("aria-hidden", indice !== indiceActual));
                    puntos.forEach((punto, indice) => punto.classList.toggle("activo", indice === indiceActual));
                    contador.textContent = `${indiceActual + 1} / ${diapositivas.length}`;
                };

                anterior.addEventListener("click", () => mostrar(indiceActual - 1));
                siguiente.addEventListener("click", () => mostrar(indiceActual + 1));
                carrusel.addEventListener("keydown", (evento) => {
                    if (evento.key === "ArrowLeft") mostrar(indiceActual - 1);
                    if (evento.key === "ArrowRight") mostrar(indiceActual + 1);
                });
                carrusel.addEventListener("touchstart", (evento) => { inicioToque = evento.touches[0].clientX; }, { passive: true });
                carrusel.addEventListener("touchend", (evento) => {
                    const distancia = evento.changedTouches[0].clientX - inicioToque;
                    if (Math.abs(distancia) > 45) mostrar(indiceActual + (distancia < 0 ? 1 : -1));
                }, { passive: true });
            });
        }

        function mostrarError(mensaje) {
            const contenedor = document.getElementById("contenedor-detalle");
            contenedor.innerHTML = `
                <div class="caja-error">
                    <h2>Guardería no encontrada</h2>
                    <p>${mensaje}</p>
                    <a href="../index.html" class="btn-regresar-catalogo" style="margin-top: 18px;">
                        ← Volver a la página principal
                    </a>
                </div>
            `;
        }
    </script>

</body>

</html>
